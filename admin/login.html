<body class="adm" data-page="login">
<div class="login">
  <div class="art">
    <div class="ph"><img src="../assets/img/uploads/article/thumbnail-gaya-kini-wastra-dari-sekolah-mode-di-in2motionfest-2025-1761101657.jpg" alt="" onerror="this.remove()"></div>
    <div class="cap"><div class="eyebrow" style="color:#E7D2B0">Event Studio</div><h2 class="serif fw-semibold mt-2" style="font-size:44px; line-height:1.05">Kelola setiap agenda,<br><i>dari tiket hingga hari H.</i></h2></div>
  </div>
  <div class="d-flex align-items-center justify-content-center p-4" style="background:var(--paper)">
    <form onsubmit="login(event)">
      <a class="logo" href="../index.html" style="font-size:44px">modest<span>.</span>id</a>

      <input class="form-control mb-3" type="password" required value="mockup123">
      <label class="f-check mb-4"><input type="checkbox" checked>Ingat saya di perangkat ini</label>

      <div class="meta text-center mt-4">Mockup — email & kata sandi apa pun bisa dipakai.</div>

  </div>
