<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — modest.id Event Studio</title>
<meta name="robots" content="noindex">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="../assets/css/modest.css" rel="stylesheet">
<link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="adm" data-page="events">

<!-- SIDEBAR -->
<aside class="adm-side" id="side">
  <div class="adm-brand"><a class="logo" href="index.html">modest<span>.</span>id</a><small>Event Studio</small></div>
  <nav class="adm-nav">
    <div class="grp">Menu</div>
    <a href="index.html"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="events.html" class="active"><i class="bi bi-calendar-event"></i>Events</a>
    <a href="orders.html"><i class="bi bi-receipt"></i>Transaksi<span class="count d-none" id="pendingBadge">0</span></a>
    <a href="attendees.html"><i class="bi bi-person-check"></i>Peserta & Check-in</a>
    <a href="promos.html"><i class="bi bi-ticket-perforated"></i>Promo</a>
    <div class="grp">Lainnya</div>
    <a href="../events.html" target="_blank"><i class="bi bi-box-arrow-up-right"></i>Lihat Situs</a>
    <a href="javascript:void(0)" onclick="resetDemo()"><i class="bi bi-arrow-repeat"></i>Reset Data Demo</a>
  </nav>
  <div class="adm-user">
    <div class="avatar" id="adminInitial">A</div>
    <div class="min-w-0 flex-grow-1"><div class="text-truncate" id="adminName">Admin</div><div class="meta">Event Manager</div></div>
    <button class="icon-btn" onclick="logout()" title="Keluar"><i class="bi bi-box-arrow-right"></i></button>
  </div>
</aside>

<div class="adm-main">
  <header class="adm-top">
    <button class="icon-btn d-lg-none" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu"><i class="bi bi-list"></i></button>
    <div class="min-w-0"><div class="crumb">Kelola</div><h1>Events</h1></div>
    <form class="adm-search ms-auto" onsubmit="globalSearch(event)"><i class="bi bi-search"></i><input class="form-control" name="q" placeholder="Cari invoice, pembeli, kode tiket…"></form>
    <div class="dropdown ms-auto ms-md-0">
      <button class="icon-btn" data-bs-toggle="dropdown" aria-label="Notifikasi"><i class="bi bi-bell"></i></button>
      <ul class="dropdown-menu dropdown-menu-end" style="width:340px"><li class="px-3 py-2 eyebrow">Transaksi Terbaru</li><div id="notifList"></div><li><hr class="dropdown-divider"></li><li><a class="dropdown-item meta" href="orders.html">Lihat semua transaksi</a></li></ul>
    </div>
  </header>
  <main class="adm-body" id="app"></main>
</div>

<!-- MODAL & OFFCANVAS -->
<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-dialog-centered" id="mDialog"><div class="modal-content" id="mBody"></div></div></div>
<div class="offcanvas offcanvas-end" tabindex="-1" id="oc" style="width:520px"><div class="offcanvas-header pb-0"><button type="button" class="btn-close ms-auto" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body px-4 pt-0" id="ocBody"></div></div>
<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index:2100">
  <div id="toast" class="toast align-items-center" role="status"><div class="d-flex"><div class="toast-body" id="toastMsg"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>
</div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/events-data.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
